      .side { fill: #121212; stroke: #3e3e3e; }
      .top { fill: #1b1b1b; stroke: #6a6a6a; }
      .top.subject { stroke: #d4d4d4; }
      .side.subject { fill: #0f0f0f; stroke: #6a6a6a; }
      .groove { stroke: #222222; }
      .screw { fill: #e6e6e6; opacity: .32; }
