<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 900 536" width="900" height="536" role="img" aria-labelledby="t d">
  <title id="t">skolar reads and writes both the vercel-labs/skills lockfile and gh skill metadata</title>
  <desc id="d">skolar sits between vercel-labs/skills and gh skill. add writes skills-lock.json or SKILL.md frontmatter, recording each skill in its SKILL.md metadata in any directory, or in an existing skills-lock.json and using the lockfile for skills gh can't express. check and update locate each skill upstream by its recorded path and compare hashes; verify checks files on disk against computedHash or github-tree-sha. Both upstream tools keep working on the same records.</desc>
