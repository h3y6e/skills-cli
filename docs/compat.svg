    .mono, .corner { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .mono { font-size: 11.5px; }
    .corner { font-size: 10.5px; letter-spacing: .1em; fill: #8c8c90; }
    .muted { fill: #8c8c90; }
    .h { font-size: 14px; font-weight: 600; fill: #18181a; }
    .card { fill: #fbfbfa; stroke: #8a8a8f; stroke-width: .6; }
    .band { fill: #ededea; }
    .rule { stroke: #d4d4d6; stroke-width: .6; }
    @media (prefers-color-scheme: dark) {
      text { fill: #a3a3a3; }
      .corner, .muted { fill: #6e6e6e; }
      .h { fill: #e6e6e6; }
      .card { fill: #131313; stroke: #6a6a6a; }
      .band { fill: #262626; }
      .rule { stroke: #3e3e3e; }
    }
    .glyph { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .pass { fill: #0ca30c; }
    .gap { fill: #fab219; }
    .gap + .glyph { fill: #18181a; }
    .fail { fill: #d03b3b; }
    .none { fill: none; stroke: #b4b4b8; stroke-width: .6; }
    .none + .glyph { fill: #8c8c90; font-weight: 400; }
    @media (prefers-color-scheme: dark) {
      .rule { stroke: #222222; }
      .none { stroke: #3e3e3e; }
      .none + .glyph { fill: #6e6e6e; }
    }
  </style>
