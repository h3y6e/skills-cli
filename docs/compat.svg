<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" role="img" aria-labelledby="t d">
  <title id="t">skolar alongside vercel-labs/skills and gh skill</title>
  <desc id="d">10 checks pass · 2 gaps in gh skill, with skolar 71abff8 · skills 1.7.1 · gh skill 2.102.0.
skills, detect (pass): when vercel installed the skills, skolar reports them up to date and update changes nothing
gh skill, detect (pass): when gh installed the skills, skolar reports them up to date and update changes nothing
skills, detect without skillPath (pass): when the lock entries have no skillPath, skolar still finds every skill vercel installed
skills, follow a move (pass): when a skillPath no longer exists upstream, skolar reports the move and update restores the lock entry vercel writes
gh skill, follow a move (pass): when a github-path no longer exists upstream, skolar reports the move and update restores the files gh installs
skills, install (pass): when skolar installs every skill vercel installs into a lockfile project, files and lock entries match and vercel update changes nothing
gh skill, install (pass): when skolar installs without a lockfile, files match a gh install and gh update changes nothing
gh skill, update (pass): when an unpinned install is behind the latest release, skolar update yields the same files as gh update
gh skill, hand back (pass): when skolar updated a gh install and upstream is unchanged, gh update changes nothing
gh skill, reinstall (pass): when gh reinstalls a skill skolar updated, the files match a fresh gh install
gh skill, undiscoverable path (gap): when skolar records root-skill in gh format, the metadata holds its real path and gh update leaves the outdated install alone until gh can discover .
gh skill, undiscoverable path (gap): when skolar records theta in gh format, the metadata holds its real path and gh update leaves the outdated install alone until gh can discover extras/theta
</desc>
  <style>
